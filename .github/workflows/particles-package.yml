name: Particle package validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TopDownParticleComponent

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TopDownParticleComponent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and typecheck
        run: |
          npm run build:package
          npm run typecheck

      - name: Run package tests
        run: npm test

      - name: Check workspace consumer
        run: npm run consumer:smoke

      - name: Check packed package consumer
        run: npm run consumer:packed-smoke

      - name: Check package contents
        run: npm run pack:package
