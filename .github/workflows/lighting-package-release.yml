name: Publish lighting package

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TopDown

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version-file: TopDown/.nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@jojo-d-little"
          cache: npm
          cache-dependency-path: TopDown/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag and package version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME
          $package = Get-Content .\packages\lighting\package.json -Raw | ConvertFrom-Json
          $packageVersion = [string]$package.version
          $expectedName = '@jojo-d-little/storyboard-lighting'
          if ($package.name -ne $expectedName) {
            throw "Package name '$($package.name)' does not match '$expectedName'."
          }
          if ($tagVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a SemVer version. Received: $tagVersion"
          }
          if ($tagVersion -ne $packageVersion) {
            throw "Release tag '$tagVersion' does not match package.json '$packageVersion'."
          }

      - name: Build and validate package
        run: |
          npm run build:package
          npm run typecheck
          npm run typecheck:core
          npm test
          npm run consumer:packed-smoke
          npm run pack:package

      - name: Publish private package to GitHub Packages
        run: npm publish ./packages/lighting --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
