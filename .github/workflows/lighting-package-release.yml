name: Publish lighting package

on:
  workflow_dispatch:
  push:
    tags:
      - "lighting-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TopDown

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js for GitHub Packages
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@jojo-d-little"
          cache: npm
          cache-dependency-path: TopDown/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and validate package
        run: |
          npm run build:package
          npm run typecheck
          npm run typecheck:core
          npm test
          npm run consumer:packed-smoke

      - name: Publish private package to GitHub Packages
        run: npm publish ./packages/lighting
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
